name: Release

# Tag a version to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Universal binary so both Apple Silicon and Intel Macs can run it.
      - name: Build universal bundles
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Package
        working-directory: src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          ditto -c -k --keepParent "macos/Very Annoyed IP Scanner.app" \
            "VeryAnnoyedIPScanner-macos-universal.zip"
          mv dmg/*.dmg "VeryAnnoyedIPScanner-macos-universal.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        working-directory: src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Very Annoyed IP Scanner $TAG" \
            --notes-file - \
            VeryAnnoyedIPScanner-macos-universal.dmg \
            VeryAnnoyedIPScanner-macos-universal.zip <<'NOTES'
          Universal macOS build (Apple Silicon and Intel).

          The app is **not code signed**, so macOS will refuse to open it on the
          first try. Right-click the app and choose *Open*, then confirm.

          Scanning uses `ping` and plain TCP connections, so no admin rights are
          needed.
          NOTES
