[package]
name = "very-annoyed-ip-scanner"
version = "0.1.0"
description = "A grumpy little clone of Angry IP Scanner"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "time", "sync", "rt", "macros", "io-util"] }
futures = "0.3"
dns-lookup = "2"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18.1"
libc = "0.2.189"
socket2 = { version = "0.6.5", features = ["all"] }
tauri-plugin-notification = "2.4.0"
